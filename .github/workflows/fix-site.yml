name: Fix site SEO and links

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "report = only list what would change, apply = write the fixes to main"
        type: choice
        default: report
        options:
          - report
          - apply

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Run the fixer
        run: |
          if [ "${{ github.event.inputs.mode }}" = "apply" ]; then
            python3 scripts/fix_site.py --apply
          else
            python3 scripts/fix_site.py
          fi

      - name: Commit the fixes
        if: ${{ github.event.inputs.mode == 'apply' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Site-wide SEO and link fixes"
            git push
          fi
